name: Build Firmware (PlatformIO)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install PlatformIO
      run: pip install platformio==6.1.16

    - name: Check Grafana secrets length (diagnostic)
      env:
        GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
        GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
      run: |
        echo "[CI-check] GRAFANA_URL len=${#GRAFANA_URL}"
        echo "[CI-check] GRAFANA_TOKEN len=${#GRAFANA_TOKEN}"
        # tail of URL (last 10 chars) to detect trailing whitespace/newlines
        # without leaking the secret. Empty if URL is empty.
        if [ -n "$GRAFANA_URL" ]; then
          TAIL=$(printf '%s' "$GRAFANA_URL" | tail -c 10 | od -An -c | tr -d ' \n')
          echo "[CI-check] URL tail (last 10 chars, octal-escaped): $TAIL"
        fi

    - name: Create constants_private.h from secrets
      run: |
        cat > include/constants_private.h << 'EOF'
        #ifndef CONSTANTS_PRIVATE_H
        #define CONSTANTS_PRIVATE_H

        // Configuración privada - generado automáticamente en CI

        const char* URL = "${{ secrets.GRAFANA_URL }}";
        const char* TOKEN_GRAFANA = "${{ secrets.GRAFANA_TOKEN }}";

        #endif
        EOF
        echo "[CI-check] generated constants_private.h:"
        wc -l include/constants_private.h
        # Show only lines that DON'T contain http or token characters
        # (we mask the secret content but show the file structure)
        sed 's/"[^"]*"/"<masked>"/g' include/constants_private.h

    - name: Run Unit Tests
      run: pio test -e native_test

    - name: Build Firmware
      run: |
        mkdir -p binarios
        pio run -e esp32dev_multi            # Compila todo, incluyendo firmware.bin
        pio run -e esp32dev_multi --target buildfs   # También el SPIFFS
        cp .pio/build/esp32dev_multi/firmware.bin binarios/firmware.bin
        cp .pio/build/esp32dev_multi/spiffs.bin binarios/ || echo "No se generó spiffs.bin"
        cp build_reports/size_report_esp32dev_multi.txt binarios/ || echo "No se generaron reportes de build"

    - name: Get Version
      id: get_version
      run: |
        VERSION=$(sed -n 's/#define FIRMWARE_VERSION "\([^"]*\)"/\1/p' include/version.h)
        echo "version=$VERSION" >> $GITHUB_ENV

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "binarios/*"
        tag: "${{ env.version }}"
        name: Release "${{ env.version }}"
        body: "Binarios de firmware generados automáticamente"
        generateReleaseNotes: true
        token: ${{ secrets.GITHUB_TOKEN }}
