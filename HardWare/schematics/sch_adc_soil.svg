"ideographic" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="466.2" dy="9">CGND</tspan></text><text x="469.79999999999995" y="-53.1" dominant-baseline="central" fill="black" font-size="9" font-family="sans" text-anchor="middle"><tspan x="469.79999999999995" dy="9">Capacitivo</tspan><tspan x="469.79999999999995" dy="9">(suelo)</tspan></text><text x="259.2" y="-244.6" dominant-baseline="ideographic" fill="#b91c1c" font-size="7" font-family="sans" text-anchor="middle"><tspan x="259.2" dy="7">AOUT (0-5V)</tspan></text><text x="259.2" y="-46.6" dominant-baseline="ideographic" fill="#0d9488" font-size="7" font-family="sans" text-anchor="middle"><tspan x="259.2" dy="7">AOUT (0-3.3V)</tspan></text><text x="466.2" y="-332.0" dominant-baseline="ideographic" fill="#b91c1c" font-size="8" font-family="sans" text-anchor="middle"><tspan x="466.2" dy="8">5V</tspan></text><text x="466.2" y="-134.0" dominant-baseline="ideographic" fill="#b91c1c" font-size="8" font-family="sans" text-anchor="middle"><tspan x="466.2" dy="8">3.3V</tspan></text><text x="262.79999999999995" y="-219.39999999999998" dominant-baseline="central" fill="#b91c1c" font-size="7" font-family="sans" text-anchor="middle"><tspan x="262.79999999999995" dy="7">(!) puede superar 3.3V</tspan></text><text x="268.2" y="89.63999999999999" dominant-baseline="hanging" fill="#6b7280" font-size="9" font-family="sans" text-anchor="middle"><tspan x="268.2" dy="9">HD38 a 5V: AO puede entregar hasta 5V — sin proteccion en este HW (medir antes).</tspan><tspan x="268.2" dy="9">GPIO34 y GPIO35 son ADC1 (OK con WiFi). NO usar ADC2 con WiFi activo.</tspan><tspan x="268.2" dy="9">Atenuacion ADC 11dB -&gt; rango lineal util ~0.15-2.5V.</tspan></text><text x="268.2" y="-389.11999999999995" dominant-baseline="ideographic" fill="#111827" font-size="15" font-family="sans" text-anchor="middle"><tspan x="268.2" dy="15">Sensores de suelo — HD38 + Capacitivo (ADC)</tspan></text></svg>